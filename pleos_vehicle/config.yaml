name: Pleos Vehicle
version: "0.1.2"
slug: pleos_vehicle
description: Dashboard and MQTT sensors for Kia, Hyundai and Genesis cars via the Pleos Vehicle Data API
url: https://github.com/bartgerritsen/kia_api
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:car-connected
panel_title: My Car
services:
  - mqtt:want
options:
  brand: kia
  client_id: ""
  client_secret: ""
  poll_interval: 60
  history_sync_interval: 30
  language: en
  mqtt_enabled: true
  mqtt_discovery_prefix: homeassistant
schema:
  brand: list(kia|hyundai|genesis)
  client_id: str
  client_secret: password
  poll_interval: int(30,3600)
  history_sync_interval: int(5,1440)
  language: list(en|nl)
  mqtt_enabled: bool
  mqtt_discovery_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  map_tile_url: url?
  map_tile_attribution: str?
